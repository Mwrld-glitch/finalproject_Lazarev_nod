[project]
name = "finalproject-lazarev-nod"
version = "0.1.0"
description = "Platform for tracking and simulating currency trading"
readme = "README.md"
authors = [
    { name = "wdohp", email = "loba4evskogo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.32.0",
]

[project.scripts]
valutatrade = "main:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
